server:
  port: 8080

spring:
  threads:
    virtual:
      enabled: true
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: identity
            uri: ${IDENTITY_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/auth/**, /users/**

          - id: student
            uri: ${STUDENT_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/students/**

          - id: matching
            uri: ${MATCHING_SERVICE_URL:http://localhost:8087}
            predicates:
              - Path=/jobs/matched, /jobs/*/candidates, /jobs/match

          - id: eligibility
            uri: ${ELIGIBILITY_SERVICE_URL:http://localhost:8085}
            predicates:
              - Path=/drives/*/rules, /drives/*/evaluate, /drives/*/eligibility, /drives/*/eligibility/**

          - id: placement
            uri: ${PLACEMENT_SERVICE_URL:http://localhost:8084}
            predicates:
              - Path=/companies/**, /jobs/**, /drives/*/apply, /applications/**, /drives, /drives/**

          - id: notification
            uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/notifications/**

          - id: report
            uri: ${REPORT_SERVICE_URL:http://localhost:8086}
            predicates:
              - Path=/reports/**

jwt:
  secret: ${JWT_SECRET:super-secret-key-scpes-2026-minimum-32-chars-long!}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
