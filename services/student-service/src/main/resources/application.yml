spring:
  threads:
    virtual:
      enabled: true
  application:
    name: student-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/scpes_db?currentSchema=student_svc}
    username: ${DB_USERNAME:student_svc_user}
    password: ${DB_PASSWORD:scpes_secret}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_schema: student_svc
  flyway:
    enabled: true
    schemas: student_svc
    default-schema: student_svc
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: student-service
      auto-offset-reset: earliest
      enable-auto-commit: false

server:
  port: 8083

grpc:
  server:
    port: 9093

jwt:
  secret: ${JWT_SECRET:super-secret-key-scpes-2026-minimum-32-chars-long!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
