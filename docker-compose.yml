services:
  postgres:
    image: postgres:16-alpine
    container_name: scpes-postgres
    command: postgres -c shared_buffers=64MB -c work_mem=4MB -c max_connections=100
    environment:
      POSTGRES_DB: scpes_db
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scpes_secret}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    deploy:
      resources:
        limits:
          memory: 256M

  kafka:
    image: apache/kafka:3.8.0
    container_name: scpes-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512M

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: scpes-identity
    ports:
      - "8082:8082"
      - "9098:9098"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/scpes_db
      DB_USERNAME: identity_svc_user
      DB_PASSWORD: ${DB_PASSWORD:-scpes_secret}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-scpes-2026-minimum-32-chars-long!}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    deploy:
      resources:
        limits:
          memory: 384M

  student-service:
    build:
      context: .
      dockerfile: services/student-service/Dockerfile
    container_name: scpes-student
    ports:
      - "8083:8083"
      - "9093:9093"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/scpes_db
      DB_USERNAME: student_svc_user
      DB_PASSWORD: ${DB_PASSWORD:-scpes_secret}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-scpes-2026-minimum-32-chars-long!}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    deploy:
      resources:
        limits:
          memory: 384M

  placement-service:
    build:
      context: .
      dockerfile: services/placement-service/Dockerfile
    container_name: scpes-placement
    ports:
      - "8084:8084"
      - "9094:9094"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/scpes_db
      DB_USERNAME: placement_svc_user
      DB_PASSWORD: ${DB_PASSWORD:-scpes_secret}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-scpes-2026-minimum-32-chars-long!}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELIGIBILITY_GRPC_HOST: eligibility-service
      ELIGIBILITY_GRPC_PORT: 9095
      MATCHING_GRPC_HOST: matching-service
      MATCHING_GRPC_PORT: 9097
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512M

  eligibility-service:
    build:
      context: .
      dockerfile: services/eligibility-service/Dockerfile
    container_name: scpes-eligibility
    ports:
      - "8085:8085"
      - "9095:9095"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/scpes_db
      DB_USERNAME: eligibility_svc_user
      DB_PASSWORD: ${DB_PASSWORD:-scpes_secret}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-scpes-2026-minimum-32-chars-long!}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      STUDENT_GRPC_HOST: student-service
      STUDENT_GRPC_PORT: 9093
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    deploy:
      resources:
        limits:
          memory: 384M

  matching-service:
    build:
      context: .
      dockerfile: services/matching-service/Dockerfile
    container_name: scpes-matching
    ports:
      - "8087:8087"
      - "9097:9097"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/scpes_db
      DB_USERNAME: matching_svc_user
      DB_PASSWORD: ${DB_PASSWORD:-scpes_secret}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-scpes-2026-minimum-32-chars-long!}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    deploy:
      resources:
        limits:
          memory: 384M

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: scpes-notification
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/scpes_db
      DB_USERNAME: notification_svc_user
      DB_PASSWORD: ${DB_PASSWORD:-scpes_secret}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-scpes-2026-minimum-32-chars-long!}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    deploy:
      resources:
        limits:
          memory: 384M

  report-service:
    build:
      context: .
      dockerfile: services/report-service/Dockerfile
    container_name: scpes-report
    ports:
      - "8086:8086"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/scpes_db
      DB_USERNAME: report_svc_user
      DB_PASSWORD: ${DB_PASSWORD:-scpes_secret}
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-scpes-2026-minimum-32-chars-long!}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    deploy:
      resources:
        limits:
          memory: 512M

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: scpes-gateway
    ports:
      - "8080:8080"
    environment:
      IDENTITY_SERVICE_URL: http://identity-service:8082
      STUDENT_SERVICE_URL: http://student-service:8083
      PLACEMENT_SERVICE_URL: http://placement-service:8084
      ELIGIBILITY_SERVICE_URL: http://eligibility-service:8085
      MATCHING_SERVICE_URL: http://matching-service:8087
      NOTIFICATION_SERVICE_URL: http://notification-service:8081
      REPORT_SERVICE_URL: http://report-service:8086
      JWT_SECRET: ${JWT_SECRET:-super-secret-key-scpes-2026-minimum-32-chars-long!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      - identity-service
    mem_limit: 384m
    deploy:
      resources:
        limits:
          memory: 384M

volumes:
  pgdata:
