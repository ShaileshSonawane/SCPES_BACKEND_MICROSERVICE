services:
  postgres:
    image: postgres:16
    container_name: scpes-postgres
    environment:
      POSTGRES_DB: scpes_db
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scpes_secret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: scpes-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: scpes-gateway
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - identity-service

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: scpes-identity
    ports:
      - "8082:8082"
      - "9092:9092"
    env_file: .env
    environment:
      DB_USERNAME: identity_svc_user
    depends_on:
      postgres:
        condition: service_healthy

  student-service:
    build:
      context: .
      dockerfile: services/student-service/Dockerfile
    container_name: scpes-student
    ports:
      - "8083:8083"
      - "9093:9093"
    env_file: .env
    environment:
      DB_USERNAME: student_svc_user
    depends_on:
      postgres:
        condition: service_healthy

  placement-service:
    build:
      context: .
      dockerfile: services/placement-service/Dockerfile
    container_name: scpes-placement
    ports:
      - "8084:8084"
      - "9094:9094"
    env_file: .env
    environment:
      DB_USERNAME: placement_svc_user
      ELIGIBILITY_GRPC_HOST: eligibility-service
      ELIGIBILITY_GRPC_PORT: 9095
    depends_on:
      postgres:
        condition: service_healthy

  eligibility-service:
    build:
      context: .
      dockerfile: services/eligibility-service/Dockerfile
    container_name: scpes-eligibility
    ports:
      - "8085:8085"
      - "9095:9095"
    env_file: .env
    environment:
      DB_USERNAME: eligibility_svc_user
      STUDENT_GRPC_HOST: student-service
      STUDENT_GRPC_PORT: 9093
    depends_on:
      postgres:
        condition: service_healthy

  matching-service:
    build:
      context: .
      dockerfile: services/matching-service/Dockerfile
    container_name: scpes-matching
    ports:
      - "8087:8087"
      - "9097:9097"
    env_file: .env
    environment:
      DB_USERNAME: matching_svc_user
    depends_on:
      postgres:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: scpes-notification
    ports:
      - "8081:8081"
      - "9091:9091"
    env_file: .env
    environment:
      DB_USERNAME: notification_svc_user
    depends_on:
      postgres:
        condition: service_healthy

  report-service:
    build:
      context: .
      dockerfile: services/report-service/Dockerfile
    container_name: scpes-report
    ports:
      - "8086:8086"
    env_file: .env
    environment:
      DB_USERNAME: report_svc_user
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
